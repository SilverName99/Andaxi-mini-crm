# nginx pentru portalul clientilor — al doilea domeniu catre aceeasi aplicatie.
#
# Diferenta fata de nginx-crm.conf: pe domeniul asta se vede DOAR portalul.
# Adresa scurta duce direct in el, iar rutele de administrare (/api/clients,
# /api/settings si restul) returneaza 404 — nici macar pagina de login nu apare.
#
# Instalare (inlocuieste 4000 cu portul din server/.env, daca l-ai schimbat):
#   sudo cp deploy/nginx-portal.conf /etc/nginx/sites-available/client.andaxi.ro
#   sudo ln -s /etc/nginx/sites-available/client.andaxi.ro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d client.andaxi.ro
#
# Mai simplu: deploy/portal-domain.sh face tot ce e mai sus, cu portul detectat singur.

server {
    listen 80;
    listen [::]:80;
    server_name client.andaxi.ro;

    client_max_body_size 2M;
    access_log /var/log/nginx/andaxi-portal.access.log;
    error_log  /var/log/nginx/andaxi-portal.error.log;

    # adresa scurta (client.andaxi.ro) duce direct in portal
    location = / {
        return 302 /portal;
    }

    # portalul si strictul necesar lui: sesiunea clientului, sigla firmei, interfata
    location /portal {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/portal/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /api/branding {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        expires 30d;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # restul aplicatiei nu exista pe domeniul asta
    location / {
        return 404;
    }
}
