# nginx pentru mini-CRM Andaxi — un singur server block, proxy catre Node (port 4000).
# Nu afecteaza celelalte site-uri de pe server: fiecare are propriul fisier in sites-available.
#
# Instalare:
#   sudo cp deploy/nginx-crm.conf /etc/nginx/sites-available/crm.andaxi.ro
#   sudo ln -s /etc/nginx/sites-available/crm.andaxi.ro /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d crm.andaxi.ro     # adauga automat blocul HTTPS

server {
    listen 80;
    listen [::]:80;
    server_name crm.andaxi.ro;

    # dimensiune maxima pentru eventuale importuri
    client_max_body_size 10M;

    # log-uri separate, ca sa nu se amestece cu ale celorlalte aplicatii
    access_log /var/log/nginx/andaxi-crm.access.log;
    error_log  /var/log/nginx/andaxi-crm.error.log;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # fisierele statice ale interfetei se pot cache-ui agresiv (au hash in nume)
    location /assets/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
